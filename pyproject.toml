[project]
name = "wikipedia-arbitration"
version = "0.1.0"
description = "Mapping and analyzing Wikipedia's dispute resolution system — tracking how conflicts emerge, escalate, and resolve."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datetime>=6.0",
    "requests>=2.32.5",
    "pywikibot>=9.0.0",
    "mwparserfromhell>=0.6.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.14.14",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "networkx>=3.6.1",
]
ml = [
    "mlflow>=2.10.0",
    "scikit-learn>=1.4.0",
    "lifelines>=0.27.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require network)",
]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
