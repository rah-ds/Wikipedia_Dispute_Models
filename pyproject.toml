[project]
name = "wikipedia-arbitration"
version = "0.1.1"
description = "Mapping and analyzing Wikipedia's dispute resolution system — tracking how conflicts emerge, escalate, and resolve."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datetime>=6.0",
    "requests>=2.32.5",
    "mwparserfromhell>=0.6.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.14.14",
    "transformers>=5.5.0",
    "torch>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a6",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "networkx>=3.6.1",
    "commitizen>=4.0.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"      # reads/writes [project].version in this file
update_changelog_on_bump = true
major_version_zero = true        # breaking changes stay on 0.x until we cut 1.0

[tool.ruff.lint]
# Scripts legitimately use sys.path.insert before local imports
per-file-ignores = { "scripts/*.py" = ["E402"] }

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require network)",
]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
